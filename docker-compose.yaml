services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE_NAME: retry_scheduler
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_NAME: jobs:queue
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_NAME: jobs:queue
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE_NAME: retry_scheduler
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "saq", "app.worker.worker_settings", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
