[project]
name = "retry-scheduler"
version = "0.1.0"
description = "Internal retry scheduler service"
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.143.1",
    "pydantic-settings>=2.16.0",
    "pymongo>=4.19.0",
    "redis>=6.4.0",
    "saq>=0.26.4",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
